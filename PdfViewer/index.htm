<!DOCTYPE html>
<html lang="en">
<head>
  <!-- =========================================
       META
  ========================================== -->
 <link rel="icon" href="/AkshatNetworkHub/PdfViewer/ANH_PdfViewer.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>DPGNotes Smart PDF Reader</title>
  <meta name="description" content="Fast mobile-first educational PDF reader powered by PDF.js with Book Mode, Share, Download and responsive rendering.">
  <meta name="keywords" content="DPGNotes, PDF Reader, PDF.js, Educational PDF Viewer, Mobile PDF Viewer, Notes Reader, Book Mode">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0f172a">
  <!-- OPEN GRAPH -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="DPGNotes Smart PDF Reader">
  <meta property="og:description" content="Fast educational PDF reading experience optimized for mobile-first learning.">
  <!-- CANONICAL -->
  <link rel="canonical" href="https://akshat-881236.github.io/AkshatNetworkHub/PdfViewer/index.htm">
  <!-- JSON LD -->
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"WebApplication",
    "name":"DPGNotes Smart PDF Reader",
    "applicationCategory":"EducationalApplication",
    "operatingSystem":"Any",
    "description":"Mobile-first educational PDF reader powered by PDF.js"
  }
  </script>

  <!-- PDF JS -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  </script>

  <!-- =========================================
       STYLE
  ========================================== -->

  <link rel="stylesheet" href="style.css">
  <script src="https://akshat-881236.github.io/TrackerJS/akshatnetworkhub.min.js" defer></script>
  <script src="https://akshat-881236.github.io/TrackerJS/akshat-add-nav.js" defer></script>
  <script src="https://akshat-881236.github.io/TrackerJS/redirect.js" defer></script>
</head>

<body>

  <!-- =========================================
       HEADER
  ========================================== -->

  <header>

    <div class="topbar">

      <div class="branding">

        <h1>
          DPGNotes Smart PDF Reader
        </h1>

        <p>
          Fast educational PDF reading experience
        </p>

      </div>

      <div class="actions">

        <button
          class="action-btn"
          onclick="downloadPDF()"
        >
          Download
        </button>

        <button
          class="action-btn"
          onclick="sharePDF()"
        >
          Share
        </button>

      </div>

    </div>

    <!-- TABS -->

    <div class="tabs">

      <button
        class="tab-btn active"
        data-page="viewerPage"
      >
        PDF View
      </button>

      <button
        class="tab-btn"
        data-page="bookPage"
      >
        Book Mode
      </button>

      <button
        class="tab-btn"
        data-page="detailsPage"
      >
        PDF Details
      </button>

    </div>

  </header>
  <!-- =========================================
       MAIN
  ========================================== -->

  <main>

    <!-- PDF VIEW -->

    <section
      class="page active"
      id="viewerPage"
    >

      <div class="viewer">

        <div class="canvas-container">

          <canvas id="pdfCanvas"></canvas>

        </div>

        <div class="controls">
          
          <button onclick="prevPage()">
            Prev
          </button>

          <span id="pageInfo">
            Page 1
          </span>

          <button onclick="nextPage()">
            Next
          </button>

          <button onclick="zoomOut()">
            -
          </button>

          <button onclick="zoomIn()">
            +
          </button>

        </div>

      </div>

    </section>

    <!-- BOOK MODE -->

    <section class="page" id="bookPage">

      <div class="book-grid">

        <div class="book-card">

          <canvas id="leftBookCanvas"></canvas>

        </div>

        <div class="book-card">

          <canvas id="rightBookCanvas"></canvas>

        </div>

      </div>
      <div class="controls">

      <button onclick="prevBookSpread()">
        Prev Spread
      </button>

      <span id="bookPageInfo">

        Pages 1 - 2

      </span>

      <button onclick="nextBookSpread()">
        Next Spread
      </button>

    </div>

    </section>

    <!-- DETAILS -->

    <section
      class="page"
      id="detailsPage"
    >

      <div class="details-grid">

        <article class="detail-card">

          <h3>
            Title
          </h3>

          <p id="detailTitle">
            -
          </p>

        </article>

        <article class="detail-card">

          <h3>
            Category
          </h3>

          <p id="detailCategory">
            -
          </p>

        </article>

        <article class="detail-card">

          <h3>
            Discipline
          </h3>

          <p id="detailDiscipline">
            -
          </p>

        </article>

        <article class="detail-card">

          <h3>
            Uploader
          </h3>

          <p id="detailUploader">
            -
          </p>

        </article>

        <article class="detail-card">

          <h3>
            Document ID
          </h3>

          <p id="detailDocId">
            -
          </p>

        </article>

      </div>

    </section>

  </main>

  <!-- =========================================
       SCRIPT
  ========================================== -->
  <script src="script.js"></script>
  <script src="https://anh-dashboard-881238.web.app/loader.js"></script>
</body>

</html>
