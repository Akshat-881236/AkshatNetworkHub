<!DOCTYPE html>
<html lang="en">

<head>

  <!-- =========================================
       META
  ========================================== -->
 <link rel="icon" href="/AkshatNetworkHub/PdfViewer/ANH_PdfViewer.png" type="image/png">
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
  >

  <title>
    DPGNotes Smart PDF Reader
  </title>

  <meta
    name="description"
    content="Fast mobile-first educational PDF reader powered by PDF.js with Book Mode, Share, Download and responsive rendering."
  >

  <meta
    name="keywords"
    content="DPGNotes, PDF Reader, PDF.js, Educational PDF Viewer, Mobile PDF Viewer, Notes Reader, Book Mode"
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <!-- OPEN GRAPH -->

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:title"
    content="DPGNotes Smart PDF Reader"
  >

  <meta
    property="og:description"
    content="Fast educational PDF reading experience optimized for mobile-first learning."
  >

  <!-- CANONICAL -->

  <link
    rel="canonical"
    href="https://akshat-881236.github.io/AkshatNetworkHub/PdfViewer/index.htm"
  >

  <!-- JSON LD -->

  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"WebApplication",
    "name":"DPGNotes Smart PDF Reader",
    "applicationCategory":"EducationalApplication",
    "operatingSystem":"Any",
    "description":"Mobile-first educational PDF reader powered by PDF.js"
  }
  </script>

  <!-- PDF JS -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  </script>

  <!-- =========================================
       STYLE
  ========================================== -->

  <style>

    /* =========================================
       RESET
    ========================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{

      --bg:#020617;

      --surface:#0f172a;

      --surface-2:#111827;

      --primary:#2563eb;

      --text:#f8fafc;

      --muted:#94a3b8;

      --border:#1e293b;
    }

    body{

      font-family:
      Inter,
      system-ui,
      sans-serif;

      background:
      var(--bg);

      color:
      var(--text);

      overflow-x:hidden;
    }

    button{

      font-family:inherit;
    }

    /* =========================================
       HEADER
    ========================================== */

    header{

      position:sticky;

      top:0;

      z-index:1000;

      background:
      rgba(2,6,23,.92);

      backdrop-filter:
      blur(20px);

      border-bottom:
      1px solid var(--border);

      padding:1rem;
    }

    .topbar{

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:1rem;

      flex-wrap:wrap;
    }

    .branding h1{

      font-size:1.25rem;

      font-weight:800;
    }

    .branding p{

      margin-top:.25rem;

      color:var(--muted);

      font-size:.85rem;
    }

    /* =========================================
       ACTIONS
    ========================================== */

    .actions{

      display:flex;

      gap:.7rem;

      flex-wrap:wrap;
    }

    .action-btn{

      border:none;

      cursor:pointer;

      background:
      var(--primary);

      color:white;

      padding:
      .85rem 1rem;

      border-radius:16px;

      font-weight:700;

      transition:.2s;
    }

    .action-btn:hover{

      opacity:.9;
    }

    /* =========================================
       TABS
    ========================================== */

    .tabs{

      display:flex;

      gap:.7rem;

      overflow:auto;

      margin-top:1rem;

      scrollbar-width:none;
    }

    .tabs::-webkit-scrollbar{

      display:none;
    }

    .tab-btn{

      border:none;

      background:
      var(--surface);

      color:
      var(--muted);

      padding:
      .9rem 1rem;

      border-radius:16px;

      cursor:pointer;

      white-space:nowrap;

      font-weight:700;
    }

    .tab-btn.active{

      background:
      var(--primary);

      color:white;
    }

    /* =========================================
       MAIN
    ========================================== */

    main{

      max-width:1600px;

      margin:auto;

      padding:1rem;
    }

    .page{

      display:none;
    }

    .page.active{

      display:block;
    }

    /* =========================================
       VIEWER
    ========================================== */

    .viewer{

      background:
      var(--surface);

      border:
      1px solid var(--border);

      border-radius:24px;

      padding:1rem;
    }

    .canvas-container{

      overflow:auto;

      text-align:center;
    }

    canvas{

      background:white;

      border-radius:18px;

      max-width:100%;
    }

    /* =========================================
       CONTROLS
    ========================================== */

    .controls{

      margin-top:1rem;

      display:flex;

      justify-content:center;

      align-items:center;

      flex-wrap:wrap;

      gap:.7rem;
    }

    .controls button{

      border:none;

      cursor:pointer;

      background:
      var(--primary);

      color:white;

      padding:
      .8rem
      1rem;

      border-radius:14px;

      font-weight:700;
    }

    .controls span{

      color:var(--muted);

      font-weight:600;
    }

    /* =========================================
       DETAILS
    ========================================== */

    .details-grid{

      display:grid;

      grid-template-columns:
      repeat(
        auto-fit,
        minmax(260px,1fr)
      );

      gap:1rem;
    }

    .detail-card{

      background:
      var(--surface);

      border:
      1px solid var(--border);

      border-radius:24px;

      padding:1rem;
    }

    .detail-card h3{

      color:var(--primary);

      margin-bottom:.8rem;
    }

    .detail-card p{

      color:var(--muted);

      line-height:1.7;
    }

    /* =========================================
       BOOK MODE
    ========================================== */

    .book-grid{

      display:grid;

      grid-template-columns:
      1fr 1fr;

      gap:1rem;
    }

    .book-card{

      background:
      var(--surface);

      border:
      1px solid var(--border);

      border-radius:24px;

      padding:1rem;

      overflow:auto;

      text-align:center;
    }

    /* =========================================
       MOBILE
    ========================================== */

    @media(max-width:768px){

      .book-grid{

        grid-template-columns:
        1fr;
      }

      .controls{

        flex-direction:column;
      }

      .action-btn{

        flex:1;
      }
    }

  </style>

</head>

<body>

  <!-- =========================================
       HEADER
  ========================================== -->

  <header>

    <div class="topbar">

      <div class="branding">

        <h1>
          DPGNotes Smart PDF Reader
        </h1>

        <p>
          Fast educational PDF reading experience
        </p>

      </div>

      <div class="actions">

        <button
          class="action-btn"
          onclick="downloadPDF()"
        >
          Download
        </button>

        <button
          class="action-btn"
          onclick="sharePDF()"
        >
          Share
        </button>

      </div>

    </div>

    <!-- TABS -->

    <div class="tabs">

      <button
        class="tab-btn active"
        data-page="viewerPage"
      >
        PDF View
      </button>

      <button
        class="tab-btn"
        data-page="bookPage"
      >
        Book Mode
      </button>

      <button
        class="tab-btn"
        data-page="detailsPage"
      >
        PDF Details
      </button>

    </div>

  </header>

  <!-- =========================================
       MAIN
  ========================================== -->

  <main>

    <!-- PDF VIEW -->

    <section
      class="page active"
      id="viewerPage"
    >

      <div class="viewer">

        <div class="canvas-container">

          <canvas id="pdfCanvas"></canvas>

        </div>

        <div class="controls">

          <button onclick="prevPage()">
            Prev
          </button>

          <span id="pageInfo">
            Page 1
          </span>

          <button onclick="nextPage()">
            Next
          </button>

          <button onclick="zoomOut()">
            -
          </button>

          <button onclick="zoomIn()">
            +
          </button>

        </div>

      </div>

    </section>

    <!-- BOOK MODE -->

    <section
      class="page"
      id="bookPage"
    >

      <div class="book-grid">

        <div class="book-card">

          <canvas id="leftBookCanvas"></canvas>

        </div>

        <div class="book-card">

          <canvas id="rightBookCanvas"></canvas>

        </div>

      </div>

    </section>

    <!-- DETAILS -->

    <section
      class="page"
      id="detailsPage"
    >

      <div class="details-grid">

        <article class="detail-card">

          <h3>
            Title
          </h3>

          <p id="detailTitle">
            -
          </p>

        </article>

        <article class="detail-card">

          <h3>
            Category
          </h3>

          <p id="detailCategory">
            -
          </p>

        </article>

        <article class="detail-card">

          <h3>
            Discipline
          </h3>

          <p id="detailDiscipline">
            -
          </p>

        </article>

        <article class="detail-card">

          <h3>
            Uploader
          </h3>

          <p id="detailUploader">
            -
          </p>

        </article>

        <article class="detail-card">

          <h3>
            Document ID
          </h3>

          <p id="detailDocId">
            -
          </p>

        </article>

      </div>

    </section>

  </main>

  <!-- =========================================
       SCRIPT
  ========================================== -->

  <script>

    /* =========================================
       PARAM ENGINE
    ========================================== */

    const params =
    new URLSearchParams(
      window.location.search
    );

    function safeParam(key){

      try{

        return params.get(key);

      }catch(error){

        console.log(error);

        return null;
      }
    }

    const pdfURL =
    safeParam("pdf");

    const title =
    safeParam("title");

    const category =
    safeParam("category");

    const discipline =
    safeParam("discipline");

    const uploader =
    safeParam("uploader");

    const docid =
    safeParam("docid");

    const initialPage =
    parseInt(
      safeParam("page")
    ) || 1;

    const initialZoom =
    parseInt(
      safeParam("zoom")
    ) || 100;

    /* =========================================
       DETAILS
    ========================================== */

    document.getElementById(
      "detailTitle"
    ).textContent =
    title || "-";

    document.getElementById(
      "detailCategory"
    ).textContent =
    category || "-";

    document.getElementById(
      "detailDiscipline"
    ).textContent =
    discipline || "-";

    document.getElementById(
      "detailUploader"
    ).textContent =
    uploader || "-";

    document.getElementById(
      "detailDocId"
    ).textContent =
    docid || "-";

    /* =========================================
       PDF STATE
    ========================================== */

    let pdfDoc = null;

    let currentPage =
    initialPage;

    let scale =
    initialZoom / 100;

    let renderTask = null;

    const canvas =
    document.getElementById(
      "pdfCanvas"
    );

    const context =
    canvas.getContext("2d");

    /* =========================================
       LOAD PDF
    ========================================== */

    async function loadPDF(){

      try{

        const loadingTask =

        pdfjsLib.getDocument({

          url:pdfURL,

          disableAutoFetch:false,

          disableStream:false,

          disableRange:false,

          enableXfa:true,
        });

        pdfDoc =
        await loadingTask.promise;

        renderPage();

      }catch(error){

        console.log(error);

        alert(
          "Failed to load PDF"
        );
      }
    }

    /* =========================================
       RENDER PAGE
    ========================================== */

    async function renderPage(){

      if(!pdfDoc){

        return;
      }

      if(renderTask){

        try{

          renderTask.cancel();

        }catch(error){

          console.log(error);
        }
      }

      const page =
      await pdfDoc.getPage(
        currentPage
      );

      const viewport =
      page.getViewport({

        scale:
        scale *
        window.devicePixelRatio
      });

      canvas.width =
      viewport.width;

      canvas.height =
      viewport.height;

      canvas.style.width =
      `${viewport.width / window.devicePixelRatio}px`;

      canvas.style.height =
      `${viewport.height / window.devicePixelRatio}px`;

      renderTask =
      page.render({

        canvasContext:context,

        viewport
      });

      await renderTask.promise;

      document.getElementById(
        "pageInfo"
      ).textContent =

      `Page ${currentPage}
       of
       ${pdfDoc.numPages}`;

      localStorage.setItem(

        "dpgnotes_pdf_state",

        JSON.stringify({

          page:
          currentPage,

          scale
        })
      );

      renderBookMode();
    }

    /* =========================================
       NAVIGATION
    ========================================== */

    function nextPage(){

      if(

        currentPage <
        pdfDoc.numPages

      ){

        currentPage++;

        renderPage();
      }
    }

    function prevPage(){

      if(currentPage > 1){

        currentPage--;

        renderPage();
      }
    }

    /* =========================================
       ZOOM
    ========================================== */

    function zoomIn(){

      scale += .1;

      renderPage();
    }

    function zoomOut(){

      if(scale > .5){

        scale -= .1;

        renderPage();
      }
    }

    /* =========================================
       BOOK MODE
    ========================================== */

    async function renderBookMode(){

      renderBookPage(
        currentPage,
        "leftBookCanvas"
      );

      renderBookPage(
        currentPage + 1,
        "rightBookCanvas"
      );
    }

    async function renderBookPage(
      pageNumber,
      canvasId
    ){

      if(

        !pdfDoc ||

        pageNumber >
        pdfDoc.numPages

      ){

        return;
      }

      const page =
      await pdfDoc.getPage(
        pageNumber
      );

      const viewport =
      page.getViewport({

        scale:.8
      });

      const canvas =
      document.getElementById(
        canvasId
      );

      const ctx =
      canvas.getContext("2d");

      canvas.width =
      viewport.width;

      canvas.height =
      viewport.height;

      await page.render({

        canvasContext:ctx,

        viewport
      }).promise;
    }

    /* =========================================
       DOWNLOAD
    ========================================== */

    function downloadPDF(){

      window.open(
        pdfURL,
        "_blank"
      );
    }

    /* =========================================
       SHARE
    ========================================== */

    async function sharePDF(){

      try{

        if(navigator.share){

          await navigator.share({

            title:
            title ||
            "DPGNotes PDF",

            url:
            window.location.href
          });

        }else{

          await navigator.clipboard
          .writeText(

            window.location.href
          );

          alert(
            "Link Copied"
          );
        }

      }catch(error){

        console.log(error);
      }
    }

    /* =========================================
       TAB ENGINE
    ========================================== */

    const tabButtons =
    document.querySelectorAll(
      ".tab-btn"
    );

    const pages =
    document.querySelectorAll(
      ".page"
    );

    tabButtons.forEach((button)=>{

      button.addEventListener(
        "click",
        ()=>{

          tabButtons.forEach((btn)=>{

            btn.classList.remove(
              "active"
            );
          });

          pages.forEach((page)=>{

            page.classList.remove(
              "active"
            );
          });

          button.classList.add(
            "active"
          );

          document
          .getElementById(

            button.dataset.page

          )
          .classList.add(
            "active"
          );
        }
      );
    });

    /* =========================================
       RESTORE STATE
    ========================================== */

    try{

      const savedState =

      JSON.parse(

        localStorage.getItem(

          "dpgnotes_pdf_state"
        )
      );

      if(savedState){

        currentPage =
        savedState.page
        || currentPage;

        scale =
        savedState.scale
        || scale;
      }

    }catch(error){

      console.log(error);
    }

    /* =========================================
       RESIZE
    ========================================== */

    let resizeTimer;

    window.addEventListener(
      "resize",
      ()=>{

        clearTimeout(
          resizeTimer
        );

        resizeTimer =
        setTimeout(()=>{

          renderPage();

        },300);
      }
    );

    /* =========================================
       INIT
    ========================================== */

    if(pdfURL){

      loadPDF();

    }else{

      alert(
        "Missing PDF URL"
      );
    }

  </script>

</body>

</html>
